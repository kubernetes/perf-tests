apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{.Name}}
  namespace: {{.Namespace}}
  labels:
    test: {{.TestClientLabel}}
spec:
  podSelector:
    matchLabels:
      test: {{.TestClientLabel}}
  policyTypes:
  - Egress
  egress:
  - ports:
    {{range .Ports}}
    - port: {{.}}
      protocol: TCP
    {{end}}
    to:
    {{range .KubeAPIServerCIDRs}}
    - ipBlock:
        cidr: {{.}}
    {{end}}
