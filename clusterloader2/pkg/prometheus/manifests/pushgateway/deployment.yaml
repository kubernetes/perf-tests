apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: monitoring
  name: pushgateway
  labels:
    k8s-app: pushgateway
  annotations:
    prometheus.io/scrape: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: pushgateway
  template:
    metadata:
      name: pushgateway
      labels:
        k8s-app: pushgateway
    spec:
      containers:
      - name: pushgateway
        image: quay.io/prometheus/pushgateway:v1.11.4
        args:
        - --log.level=warn
        ports:
        - name: web
          containerPort: 9091
        requests:
          limits:
            cpu: 200m
            memory: {{IfThenElse (lt .Nodes 500) 200 400}}Mi
          requests:
            cpu: 200m
            memory: {{IfThenElse (lt .Nodes 500) 200 400}}Mi
