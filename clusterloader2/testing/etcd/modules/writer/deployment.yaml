{{$image := DefaultParam .CL2_BENCHMARK_IMAGE "gcr.io/k8s-staging-perf-tests/perf-tests-util/request-benchmark:v0.0.23"}}
{{$imagePullPolicy := DefaultParam .CL2_IMAGE_PULL_POLICY "IfNotPresent"}}
{{$endpoints := DefaultParam .Endpoints "http://etcd-cluster-0:2379"}}
{{$qps := DefaultParam .Qps 100}}
{{$keyCount := DefaultParam .KeyCount 150000}}
{{$keyPrefix := DefaultParam .KeyPrefix "/registry/pods/default/pod-"}}
{{$payloadType := DefaultParam .PayloadType "pod"}}
{{$compactInterval := DefaultParam .CompactInterval "90s"}}
{{$compactPhysical := DefaultParam .CompactPhysical true}}
{{$defragInterval := DefaultParam .DefragInterval "0s"}}
{{$cpu := DefaultParam .cpu "500m"}}
{{$memory := DefaultParam .memory "256Mi"}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  labels:
    group: benchmark-write
spec:
  replicas: {{.Replicas}}
  selector:
    matchLabels:
      name: {{.Name}}
  template:
    metadata:
      labels:
        name: {{.Name}}
        group: benchmark-write
    spec:
      containers:
      - name: etcd-writer
        image: {{$image}}
        imagePullPolicy: {{$imagePullPolicy}}
        args:
        - etcd-put
        - --endpoints={{$endpoints}}
        - --qps={{$qps}}
        - --concurrency=10
        - --key-count={{$keyCount}}
        - --key-prefix={{$keyPrefix}}
        - --payload-type={{$payloadType}}
        - --compact-interval={{$compactInterval}}
        - --compact-physical={{$compactPhysical}}
        - --defrag-interval={{$defragInterval}}
        ports:
        - name: metrics
          containerPort: 8080
        resources:
          requests:
            cpu: {{$cpu}}
            memory: {{$memory}}
          limits:
            cpu: {{$cpu}}
            memory: {{$memory}}
