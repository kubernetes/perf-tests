{{$SCHEDULER_NAME := DefaultParam .CL2_SCHEDULER_NAME "default-scheduler"}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  labels:
    group: ilb-load
spec:
  replicas: {{.NumReplicas}}
  selector:
    matchLabels:
      name: {{.Name}}
  template:
    metadata:
      labels:
        group: ilb-load
        name: {{.Name}}
    spec:
      schedulerName: {{$SCHEDULER_NAME}}
      containers:
      - name: {{.Name}}
        image: nginx
        ports:
        - containerPort: 8080
