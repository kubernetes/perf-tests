{{$TolerateControlPlane := DefaultParam .CL2_INFORMER_TOLERATE_CONTROL_PLANE false}}
{{$RunOnControlPlane := DefaultParam .RunOnControlPlane false}}
{{$DisableCompression := DefaultParam .DisableCompression false}}
{{$Cpu := DefaultParam .CL2_INFORMER_CPU "6"}}
{{$Memory := DefaultParam .CL2_INFORMER_MEMORY "16Gi"}}
{{$GoMemLimit := DefaultParam .CL2_INFORMER_GOMEMLIMIT "14GiB"}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Name}}
  labels:
    group: informer
spec:
  selector:
    matchLabels:
      group: informer
  template:
    metadata:
      labels:
        group: informer
    spec:
{{if or $TolerateControlPlane $RunOnControlPlane}}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
{{end}}
{{if $RunOnControlPlane}}
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
{{end}}
      containers:
        - name: {{.Name}}
          image: gcr.io/k8s-staging-perf-tests/perf-tests-util/request-benchmark:v0.0.24
          resources:
            requests:
              memory: "{{$Memory}}"
              cpu: "{{$Cpu}}"
            limits:
              memory: "{{$Memory}}"
              cpu: "{{$Cpu}}"
          env:
            - name: GOMEMLIMIT
              value: "{{$GoMemLimit}}"
{{if $RunOnControlPlane}}
            - name: KUBERNETES_SERVICE_HOST
              value: "127.0.0.1"
            - name: KUBERNETES_SERVICE_PORT
              value: "443"
{{end}}
          args:
            - "informer"
            - "--alsologtostderr=true"
            - "--v=4"
            - "--count=1"
            - "--content-type=proto"
            - "--enableWatchListFeature={{.EnableWatchListFeature}}"
            - "--api-version=v1"
            - "--resource=pods"
            - "--disableCompression={{$DisableCompression}}"
