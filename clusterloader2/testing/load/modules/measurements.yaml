## Measurement module defines test scoped measurement.

## Input params
# Valid actions: "start", "gather"
{{$action := .action}}

## Feature-gates and configs:
{{$ALLOWED_SLOW_API_CALLS := DefaultParam .CL2_ALLOWED_SLOW_API_CALLS 0}}
{{$API_AVAILABILITY_PERCENTAGE_THRESHOLD := DefaultParam .CL2_API_AVAILABILITY_PERCENTAGE_THRESHOLD 99.5}}
{{$CLUSTER_OOMS_IGNORED_PROCESSES := DefaultParam .CL2_CLUSTER_OOMS_IGNORED_PROCESSES ""}}
{{$CLUSTER_OOMS_FAILURE_ENABLED := DefaultParam .CL2_CLUSTER_OOMS_FAILURE_ENABLED true}}
{{$CLUSTER_OOMS_TRACKER_TIMEOUT := DefaultParam .CL2_CLUSTER_OOMS_TRACKER_TIMEOUT "30m"}}
{{$CUSTOM_API_CALL_THRESHOLDS := DefaultParam .CUSTOM_API_CALL_THRESHOLDS ""}}
{{$ENABLE_API_AVAILABILITY_MEASUREMENT := DefaultParam .CL2_ENABLE_API_AVAILABILITY_MEASUREMENT false}}
{{$API_AVAILABILITY_MEASUREMENT_IPS_CONFIGURED := DefaultParam .CL2_API_AVAILABILITY_MEASUREMENT_IPS_CONFIGURED false}}
{{$API_AVAILABILITY_MEASUREMENT_USE_INTERNAL_IPS := DefaultParam .CL2_API_AVAILABILITY_MEASUREMENT_USE_INTERNAL_IPS false}}
{{$API_AVAILABILITY_MEASUREMENT_USE_PUBLIC_IPS := DefaultParam .CL2_API_AVAILABILITY_MEASUREMENT_USE_PUBLIC_IPS false}}
{{$ENABLE_IN_CLUSTER_NETWORK_LATENCY := DefaultParam .CL2_ENABLE_IN_CLUSTER_NETWORK_LATENCY true}}
{{$ENABLE_SLO_MEASUREMENT := DefaultParam .CL2_ENABLE_SLO_MEASUREMENT true}}
{{$ENABLE_CLUSTER_OOMS_TRACKER := DefaultParam .CL2_ENABLE_CLUSTER_OOMS_TRACKER true}}
{{$ENABLE_NODE_LOCAL_DNS_LATENCY := DefaultParam .CL2_ENABLE_NODE_LOCAL_DNS_LATENCY false}}
{{$ENABLE_RESTART_COUNT_CHECK := DefaultParam .ENABLE_RESTART_COUNT_CHECK true}}
{{$CONTAINER_RESTARTS_FAILURE_ENABLED := DefaultParam .CL2_CONTAINER_RESTARTS_FAILURE_ENABLED true}}
{{$ENABLE_SYSTEM_POD_METRICS:= DefaultParam .ENABLE_SYSTEM_POD_METRICS true}}
{{$ENABLE_VIOLATIONS_FOR_API_CALL_PROMETHEUS := DefaultParam .CL2_ENABLE_VIOLATIONS_FOR_API_CALL_PROMETHEUS false}}
{{$ENABLE_VIOLATIONS_FOR_API_CALL_PROMETHEUS_SIMPLE := DefaultParam .CL2_ENABLE_VIOLATIONS_FOR_API_CALL_PROMETHEUS_SIMPLE true}}
{{$ENABLE_CEP_PROPAGATION_DELAY_MEASUREMENT := DefaultParam .CL2_ENABLE_CEP_PROPAGATION_DELAY_MEASUREMENT false}}
{{$ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST := DefaultParam .CL2_ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST false}}
{{$CEP_PROPAGATION_DELAY_SLO_BUCKET := DefaultParam .CL2_CEP_PROPAGATION_DELAY_SLO_BUCKET 600}}
{{$CEP_PROPAGATION_DELAY_SLO_PERCENTILE := DefaultParam .CL2_CEP_PROPAGATION_DELAY_SLO_PERCENTILE 95.0}}
{{$ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST := DefaultParam .CL2_ENABLE_NETWORK_POLICY_ENFORCEMENT_LATENCY_TEST false}}
{{$ENABLE_CONTAINER_RESTARTS_MEASUREMENT := DefaultParam .CL2_ENABLE_CONTAINER_RESTARTS_MEASUREMENT false}}
{{$ENABLE_CONTAINER_RESOURCES_MEASUREMENT := DefaultParam .CL2_ENABLE_CONTAINER_RESOURCES_MEASUREMENT false}}
{{$ENABLE_TERMINATED_WATCHES_MEASUREMENT := DefaultParam .CL2_ENABLE_TERMINATED_WATCHES_MEASUREMENT false}}
{{$ENABLE_QUOTAS_USAGE_MEASUREMENT := DefaultParam .CL2_ENABLE_QUOTAS_USAGE_MEASUREMENT false}}
{{$ENABLE_BPF_MAP_PRESSURE_MEASUREMENT := DefaultParam .CL2_ENABLE_BPF_MAP_PRESSURE_MEASUREMENT false}}
{{$BPF_MAP_PRESSURE_MAX_THRESHOLD := DefaultParam .CL2_BPF_MAP_PRESSURE_MAX_THRESHOLD 90}}
{{$ALLOWED_CONTAINER_RESTARTS := DefaultParam .CL2_ALLOWED_CONTAINER_RESTARTS 1}}
{{$CUSTOM_ALLOWED_CONTAINER_RESTARTS := DefaultParam .CL2_CUSTOM_ALLOWED_CONTAINER_RESTARTS ""}}
{{$NODE_LOCAL_DNS_LATENCY_THRESHOLD := DefaultParam .CL2_NODE_LOCAL_DNS_LATENCY_THRESHOLD "5s"}}
{{$PROMETHEUS_SCRAPE_KUBE_PROXY := DefaultParam .PROMETHEUS_SCRAPE_KUBE_PROXY true}}
{{$PROMETHEUS_SCRAPE_KUBE_STATE_METRICS := DefaultParam .PROMETHEUS_SCRAPE_KUBE_STATE_METRICS false}}
{{$PROMETHEUS_SCRAPE_METRICS_SERVER_METRICS := DefaultParam .PROMETHEUS_SCRAPE_METRICS_SERVER_METRICS false}}
{{$PROBE_MEASUREMENTS_PING_SLEEP_DURATION := DefaultParam .CL2_PROBE_MEASUREMENTS_PING_SLEEP_DURATION "1s"}}
{{$RESTART_COUNT_THRESHOLD_OVERRIDES:= DefaultParam .RESTART_COUNT_THRESHOLD_OVERRIDES ""}}
{{$USE_SIMPLE_LATENCY_QUERY := DefaultParam .USE_SIMPLE_LATENCY_QUERY false}}
{{$ENABLE_VIOLATIONS_FOR_NETWORK_PROGRAMMING_LATENCIES := DefaultParam .CL2_ENABLE_VIOLATIONS_FOR_NETWORK_PROGRAMMING_LATENCIES false}}
{{$NETWORK_PROGRAMMING_LATENCY_THRESHOLD := DefaultParam .CL2_NETWORK_PROGRAMMING_LATENCY_THRESHOLD "30s"}}
{{$NETWORK_LATENCY_THRESHOLD := DefaultParam .CL2_NETWORK_LATENCY_THRESHOLD "0s"}}
{{$SINGLE_RESOURCE_API_LATENCY_THRESHOLD := DefaultParam .CL2_SINGLE_RESOURCE_API_LATENCY_THRESHOLD "1s"}}
{{$ENABLE_VIOLATIONS_FOR_WATCH_CACHE_LAG := DefaultParam .CL2_ENABLE_VIOLATIONS_FOR_WATCH_CACHE_LAG true}}
{{$WATCH_CACHE_LAG_THRESHOLD := DefaultParam .CL2_WATCH_CACHE_LAG_THRESHOLD 90}}
{{$ENABLE_VIOLATIONS_FOR_INFORMER_CACHE_LAG := DefaultParam .CL2_ENABLE_VIOLATIONS_FOR_INFORMER_CACHE_LAG true}}
{{$INFORMER_CACHE_LAG_THRESHOLD := DefaultParam .CL2_INFORMER_CACHE_LAG_THRESHOLD 90}}

# Probe measurements shared parameter
{{$PROBE_MEASUREMENTS_CHECK_PROBES_READY_TIMEOUT := DefaultParam .CL2_PROBE_MEASUREMENTS_CHECK_PROBES_READY_TIMEOUT "15m"}}
{{$PROBE_MEASUREMENTS_CHECK_PROBES_READY_INTERVAL := DefaultParam .CL2_PROBE_MEASUREMENTS_CHECK_PROBES_READY_INTERVAL (IfThenElse (ge .Nodes 5000) "60s" "15s")}}

steps:
- name: "{{$action}}ing measurements"
  measurements:
  - Identifier: APIResponsivenessPrometheus
    Method: APIResponsivenessPrometheus
    Params:
      action: {{$action}}
{{if not $USE_SIMPLE_LATENCY_QUERY}}
      enableViolations: {{$ENABLE_VIOLATIONS_FOR_API_CALL_PROMETHEUS}}
      allowedSlowCalls: {{$ALLOWED_SLOW_API_CALLS}}
      customThresholds: {{YamlQuote $CUSTOM_API_CALL_THRESHOLDS 4}}
      singleResourceThreshold: {{$SINGLE_RESOURCE_API_LATENCY_THRESHOLD}}
{{end}}
  - Identifier: ActiveWatchRequests
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: ActiveWatchRequests
      metricVersion: v1
      unit: watches
      dimensions:
      - resource
      queries:
      - query: sum by (resource) (apiserver_longrunning_requests{verb="WATCH"})
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: WatchEventsDispatchLatency
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: WatchEventsDispatchLatency
      metricVersion: v1
      unit: s
      dimensions:
      - resource
      - stage
      queries:
      - query: histogram_quantile(0.99, sum(rate(apiserver_watch_events_dispatch_duration_seconds_bucket{resource="pods",stage!="total"}[1m])) by (resource, stage, le))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: WatchCacheEventsDispatchedRate
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: WatchCacheEventsDispatchedRate
      metricVersion: v1
      unit: ops
      dimensions:
      - resource
      queries:
      - query: sum by (resource) (rate(apiserver_watch_cache_events_dispatched_total[1m]))
        aggregations:
        - Min
        - Perc10
        - Perc50
        - Avg
        - Perc90
        - Perc99
        - Max
  - Identifier: WatchDataRate
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: WatchDataRate
      metricVersion: v1
      unit: Bps
      dimensions:
      - resource
      queries:
      - query: sum by (resource) (rate(apiserver_watch_events_sizes_sum[1m]))
        aggregations:
        - Min
        - Perc10
        - Perc50
        - Avg
        - Perc90
        - Perc99
        - Max
  - Identifier: WatchCacheLag
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      enableViolations: {{$ENABLE_VIOLATIONS_FOR_WATCH_CACHE_LAG}}
      metricName: WatchCacheLag
      metricVersion: v1
      unit: s
      queries:
      - query: ((scalar(max(etcd_debugging_mvcc_current_revision)) - apiserver_watch_cache_resource_version{resource="pods"}) / scalar(max(deriv(etcd_debugging_mvcc_current_revision[30s])) > 0))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        threshold: {{$WATCH_CACHE_LAG_THRESHOLD}}
  - Identifier: WatchCacheReadWaitLatency
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: WatchCacheReadWaitLatency
      metricVersion: v1
      unit: s
      dimensions:
      - resource
      queries:
      - query: histogram_quantile(0.99, sum by (resource, le) (rate(apiserver_watch_cache_read_wait_seconds_bucket{resource="pods"}[1m])))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: InformerQueuedItems
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: InformerQueuedItems
      metricVersion: v1
      unit: items
      dimensions:
      - resource
      - endpoint
      queries:
      - query: informer_queued_items{resource="pods"}
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: InformerProcessingLatency
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: InformerProcessingLatency
      metricVersion: v1
      unit: s
      dimensions:
      - resource
      - endpoint
      queries:
      - query: histogram_quantile(0.99, sum(rate(informer_processing_latency_seconds_bucket{resource="pods"}[1m])) by (resource, endpoint, le))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: InformerCacheLag
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      enableViolations: {{$ENABLE_VIOLATIONS_FOR_INFORMER_CACHE_LAG}}
      metricName: InformerCacheLag
      metricVersion: v1
      unit: s
      dimensions:
      - name
      queries:
      - query: ((scalar(max(etcd_debugging_mvcc_current_revision)) - informer_store_resource_version{resource="pods"}) / scalar(max(deriv(etcd_debugging_mvcc_current_revision[30s])) > 0))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        threshold: {{$INFORMER_CACHE_LAG_THRESHOLD}}
  - Identifier: APIResponsivenessPrometheusSimple
    Method: APIResponsivenessPrometheus
    Params:
      action: {{$action}}
      enableViolations: {{$ENABLE_VIOLATIONS_FOR_API_CALL_PROMETHEUS_SIMPLE}}
      useSimpleLatencyQuery: true
      summaryName: APIResponsivenessPrometheus_simple
      allowedSlowCalls: {{$ALLOWED_SLOW_API_CALLS}}
      customThresholds: {{YamlQuote $CUSTOM_API_CALL_THRESHOLDS 4}}
      singleResourceThreshold: {{$SINGLE_RESOURCE_API_LATENCY_THRESHOLD}}
  - Identifier: CreatePhasePodStartupLatency
    Method: PodStartupLatency
    Params:
      action: {{$action}}
      labelSelector: group = load
      threshold: 1h # TODO(https://github.com/kubernetes/perf-tests/issues/1024): Ideally, this should be 5s
{{if $ENABLE_IN_CLUSTER_NETWORK_LATENCY}}
  - Identifier: InClusterNetworkLatency
    Method: InClusterNetworkLatency
    Params:
      action: {{$action}}
      checkProbesReadyTimeout: {{$PROBE_MEASUREMENTS_CHECK_PROBES_READY_TIMEOUT}}
      checkProbesReadyInterval: {{$PROBE_MEASUREMENTS_CHECK_PROBES_READY_INTERVAL}}
      replicasPerProbe: {{AddInt 2 (DivideInt .Nodes 100)}}
      pingSleepDuration: {{$PROBE_MEASUREMENTS_PING_SLEEP_DURATION}}
      threshold: {{$NETWORK_LATENCY_THRESHOLD}}
{{end}}
{{if $ENABLE_NODE_LOCAL_DNS_LATENCY}}
  - Identifier: NodeLocalDNSLatency
    Method: NodeLocalDNSLatencyPrometheus
    Params:
      action: {{$action}}
      enableViolations: true
      threshold: {{$NODE_LOCAL_DNS_LATENCY_THRESHOLD}}
{{end}}
{{if $ENABLE_SLO_MEASUREMENT}}
  - Identifier: SLOMeasurement
    Method: SLOMeasurement
    Params:
      action: {{$action}}
      checkProbesReadyTimeout: {{$PROBE_MEASUREMENTS_CHECK_PROBES_READY_TIMEOUT}}
      checkProbesReadyInterval: {{$PROBE_MEASUREMENTS_CHECK_PROBES_READY_INTERVAL}}
      replicasPerProbe: {{AddInt 2 (DivideInt .Nodes 100)}}
{{end}}
{{if $PROMETHEUS_SCRAPE_KUBE_PROXY}}
  - Identifier: NetworkProgrammingLatency
    Method: NetworkProgrammingLatency
    Params:
      action: {{$action}}
      enableViolations: {{$ENABLE_VIOLATIONS_FOR_NETWORK_PROGRAMMING_LATENCIES}}
      threshold: {{$NETWORK_PROGRAMMING_LATENCY_THRESHOLD}}
  - Identifier: Kube-proxy partial iptables restore failures
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: KubeProxyIptablesRestoreFailures
      metricVersion: v1alpha1
      unit: failures
      queries:
      - name: Total
        query: sum(kubeproxy_sync_proxy_rules_iptables_partial_restore_failures_total)
        requireSamples: false # It is a feature gate and may not be enabled
        threshold: 0
{{end}}
{{if $PROMETHEUS_SCRAPE_KUBE_STATE_METRICS}}
  - Identifier: KubeStateMetricsLatency
    Method: KubeStateMetricsLatency
    Params:
      action: {{$action}}
{{end}}
{{if $PROMETHEUS_SCRAPE_METRICS_SERVER_METRICS}}
  - Identifier: MetricsServerPrometheus
    Method: MetricsServerPrometheus
    Params:
      action: {{$action}}
{{end}}

{{if $ENABLE_API_AVAILABILITY_MEASUREMENT}}
  - Identifier: APIAvailability
    Method: APIAvailability
    Params:
      action: {{$action}}
      pollFrequency: "5s"
      hostPollTimeoutSeconds: 5
      threshold: {{$API_AVAILABILITY_PERCENTAGE_THRESHOLD}}
      {{if $API_AVAILABILITY_MEASUREMENT_IPS_CONFIGURED}}
      useHostInternalIPs: {{$API_AVAILABILITY_MEASUREMENT_USE_INTERNAL_IPS}}
      useHostPublicIPs: {{$API_AVAILABILITY_MEASUREMENT_USE_PUBLIC_IPS}}
      {{end}}
{{end}}
{{if $ENABLE_CONTAINER_RESTARTS_MEASUREMENT}}
  - Identifier: ContainerRestarts
    Method: ContainerRestarts
    Params:
      action: {{$action}}
      failureEnabled: {{$CONTAINER_RESTARTS_FAILURE_ENABLED}}
      enableViolations: true
      defaultAllowedRestarts: {{$ALLOWED_CONTAINER_RESTARTS}}
      customAllowedRestarts: {{YamlQuote $CUSTOM_ALLOWED_CONTAINER_RESTARTS 4}}
{{end}}
{{if $ENABLE_CONTAINER_RESOURCES_MEASUREMENT}}
  - Identifier: ContainerCPU
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: Container CPU
      metricVersion: v1
      unit: cores
      dimensions:
      - container
      queries:
      - query: sum by (container, pod, instance) (rate(container_cpu_usage_seconds_total[1m]))
        aggregations:
        - Perc99
        - Perc90
        - Perc50
  - Identifier: ContainerMemory
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: Container Memory
      metricVersion: v1
      unit: MiB
      dimensions:
      - container
      queries:
      - query: sum by (container, pod, instance) (container_memory_working_set_bytes / 1024 / 1024)
        aggregations:
        - Perc99
        - Perc90
        - Perc50
{{end}}
{{if $ENABLE_TERMINATED_WATCHES_MEASUREMENT}}
  - Identifier: TerminatedWatchesMetrics
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: Terminated Watches
      metricVersion: v1
      dimensions:
      - resource
      queries:
      - name: Terminated watches
        query: sum(increase(apiserver_terminated_watchers_total[%v:])) by (resource)
  - Identifier: WatchCacheInitializations
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: Watch Cache Initializations
      metricVersion: v1
      dimensions:
      - resource
      queries:
      - name: Watch cache reinitializations
        query: sum(increase(apiserver_watch_cache_initializations_total[%v:])) by (resource)
{{end}}
  - Identifier: InitEvents
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: Init Events
      metricVersion: v1
      unit: events
      dimensions:
      - group
      - resource
      queries:
      - name: Init events
        query: sum(apiserver_init_events_total) by (group, resource)
{{if $ENABLE_QUOTAS_USAGE_MEASUREMENT}}
  - Identifier: Quotas total usage
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: Quota usage
      metricVersion: v1
      prometheusClient: managed
      unit: QPMs
      dimensions:
      - quota_metric
      queries:
      - name: perc99
        query: quantile_over_time(0.99, sum by (quota_metric) (irate(serviceruntime_googleapis_com:quota_rate_net_usage{monitored_resource="consumer_quota"}[1m]))[%v:]) * 60
      - name: max
        query: max_over_time(sum by (quota_metric) (irate(serviceruntime_googleapis_com:quota_rate_net_usage{monitored_resource="consumer_quota"}[1m]))[%v:]) * 60
{{end}}
{{if $ENABLE_BPF_MAP_PRESSURE_MEASUREMENT}}
  - Identifier: BPFMapPressure
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: BPF Map Pressure
      metricVersion: v1
      unit: "%"
      queries:
      - name: BPF Map Pressure (Max)
        query: max_over_time(max(cilium_bpf_map_pressure)[%v:]) * 100
        threshold: {{$BPF_MAP_PRESSURE_MAX_THRESHOLD}}
{{end}}
{{if $ENABLE_CEP_PROPAGATION_DELAY_MEASUREMENT}}
  - Identifier: CiliumEndpointPropagationDelay
    Method: CiliumEndpointPropagationDelay
    Params:
      action: {{$action}}
      bucketSLO: {{$CEP_PROPAGATION_DELAY_SLO_BUCKET}}
      percentileSLO: {{$CEP_PROPAGATION_DELAY_SLO_PERCENTILE}}
      enableViolations: true
{{end}}
  - Identifier: TestMetrics
    Method: TestMetrics
    Params:
      action: {{$action}}
      systemPodMetricsEnabled: {{$ENABLE_SYSTEM_POD_METRICS}}
      systemPodsFailureEnabled: {{$CONTAINER_RESTARTS_FAILURE_ENABLED}}
      clusterOOMsIgnoredProcesses: {{YamlQuote $CLUSTER_OOMS_IGNORED_PROCESSES 4}}
      clusterOOMsTrackerEnabled: {{$ENABLE_CLUSTER_OOMS_TRACKER}}
      clusterOOMsFailureEnabled: {{$CLUSTER_OOMS_FAILURE_ENABLED}}
      clusterOOMsTrackerTimeout: {{$CLUSTER_OOMS_TRACKER_TIMEOUT}}
      restartCountThresholdOverrides: {{YamlQuote $RESTART_COUNT_THRESHOLD_OVERRIDES 4}}
      enableRestartCountCheck: {{$ENABLE_RESTART_COUNT_CHECK}}
  - Identifier: ResourceSize
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: ResourceSize
      metricVersion: v1
      unit: MiB
      dimensions:
      - resource
      - group
      queries:
      - query: apiserver_resource_size_estimate_bytes / 1024 / 1024
        aggregations:
        - Perc99
        - max
  - Identifier: ObjectCount
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: ObjectCount
      metricVersion: v1
      unit: count
      dimensions:
      - resource
      - group
      queries:
      - query: apiserver_resource_objects
        aggregations:
        - Perc99
        - max
  # === APF ===
  - Identifier: APFRejectedRequestsRate
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFRejectedRequestsRate
      metricVersion: v1
      unit: reqps
      dimensions:
      - priority_level
      - flow_schema
      - reason
      queries:
      - query: sum by (priority_level, flow_schema, reason) (rate(apiserver_flowcontrol_rejected_requests_total[1m]))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: APFDispatchedRequestsRate
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFDispatchedRequestsRate
      metricVersion: v1
      unit: reqps
      dimensions:
      - priority_level
      - flow_schema
      queries:
      - query: sum by (priority_level, flow_schema) (rate(apiserver_flowcontrol_dispatched_requests_total[1m]))
        aggregations:
        - Min
        - Perc10
        - Perc50
        - Avg
        - Perc90
        - Perc99
        - Max
  - Identifier: APFCurrentInQueueRequests
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFCurrentInQueueRequests
      metricVersion: v1
      unit: requests
      dimensions:
      - priority_level
      - flow_schema
      queries:
      - query: sum by (priority_level, flow_schema) (apiserver_flowcontrol_current_inqueue_requests)
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: APFCurrentExecutingSeats
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFCurrentExecutingSeats
      metricVersion: v1
      unit: seats
      dimensions:
      - priority_level
      - flow_schema
      queries:
      - query: sum by (priority_level, flow_schema) (apiserver_flowcontrol_current_executing_seats)
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: APFCurrentLimitSeats
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFCurrentLimitSeats
      metricVersion: v1
      unit: seats
      dimensions:
      - priority_level
      queries:
      - query: sum by (priority_level) (apiserver_flowcontrol_current_limit_seats)
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: APFRequestWaitDuration
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFRequestWaitDuration
      metricVersion: v1
      unit: s
      dimensions:
      - priority_level
      - flow_schema
      - executed
      queries:
      - query: histogram_quantile(0.99, sum by (priority_level, flow_schema, executed, le) (rate(apiserver_flowcontrol_request_wait_duration_seconds_bucket[1m])))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: APFRequestExecutionDuration
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: APFRequestExecutionDuration
      metricVersion: v1
      unit: s
      dimensions:
      - priority_level
      - flow_schema
      queries:
      - query: histogram_quantile(0.99, sum by (priority_level, flow_schema, le) (rate(apiserver_flowcontrol_request_execution_seconds_bucket[1m])))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  # === Etcd & Storage ===
  - Identifier: StorageUpdateConflictRate
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: StorageUpdateConflictRate
      metricVersion: v1
      unit: ops
      dimensions:
      - operation
      - resource
      queries:
      - query: sum by (operation, resource) (rate(etcd_request_errors_total{reason="Conflict"}[1m]))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
  - Identifier: StorageUpdateConflictRatio
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: StorageUpdateConflictRatio
      metricVersion: v1
      unit: ratio
      dimensions:
      - operation
      - resource
      queries:
      - query: sum by (operation, resource) (rate(etcd_request_errors_total{reason="Conflict"}[1m])) / sum by (operation, resource) (rate(etcd_requests_total[1m]))
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
