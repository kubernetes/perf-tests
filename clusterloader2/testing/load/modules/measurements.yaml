        - Perc10
        - Perc50
        - Avg
        - Perc90
        - Perc99
        - Max
  - Identifier: EtcdDBSize
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: EtcdDBSize
      metricVersion: v1
      unit: B
      queries:
      - name: Total
        query: etcd_mvcc_db_total_size_in_bytes
        aggregations:
        - Max
        - Perc99
        - Avg
        - Min
      - name: InUse
        query: etcd_mvcc_db_total_size_in_use_in_bytes
        aggregations:
        - Max
        - Perc99
        - Avg
        - Min
      - name: Quota
        query: etcd_server_quota_backend_bytes
        aggregations:
        - Max
  - Identifier: EtcdCompactWindow
    Method: GenericPrometheusQuery
    Params:
      action: {{$action}}
      metricName: EtcdCompactWindow
      metricVersion: v1
      unit: s
      queries:
      - query: (etcd_debugging_mvcc_current_revision - etcd_debugging_mvcc_compact_revision) / (rate(etcd_debugging_mvcc_current_revision[5m]) > 0)
        aggregations:
        - Max
        - Perc99
        - Perc90
        - Perc50
        - Avg
