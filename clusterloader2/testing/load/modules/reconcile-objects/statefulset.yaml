{{$EnablePVs := DefaultParam .CL2_ENABLE_PVS true}}
{{$PVSize := DefaultParam .CL2_PV_SIZE "100Mi"}}
{{$PVStorageClass := DefaultParam .CL2_PV_STORAGE_CLASS ""}}
{{$TOLERATION := DefaultParam .CL2_TOLERATION ""}}
{{$podPayloadSize := DefaultParam .CL2_STATEFULSET_POD_PAYLOAD_SIZE 0}}
{{$Image := DefaultParam .Image (Concat .ImageRegistry "/pause:3.9")}}
{{$RuntimeClassName := DefaultParam .CL2_RUNTIME_CLASS_NAME nil}}
{{$RealisticPod := DefaultParam .CL2_REALISTIC_POD false}}
{{$RealisticPodSizeKB := DefaultParam .CL2_REALISTIC_POD_SIZE_KB 10}}
{{if and (ne $RealisticPodSizeKB 10) (ne $RealisticPodSizeKB 20)}}
  {{DivideInt 1 0}}
{{end}}
{{$RealisticPod20KB := and $RealisticPod (eq $RealisticPodSizeKB 20)}}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Name}}
  labels:
    group: load
spec:
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      group: load
      name: {{.Name}}
  serviceName: {{.Name}}
  replicas: {{RandIntRange .ReplicasMin .ReplicasMax}}
  template:
    metadata:
      labels:
        group: load
        name: {{.Name}}
{{if $RealisticPod }}
        app.kubernetes.io/name: "payment-service"
        app.kubernetes.io/instance: "payment-service-primary"
        app.kubernetes.io/version: "v2.1.4"
        app.kubernetes.io/component: "backend"
        app.kubernetes.io/part-of: "ecommerce-platform"
        env: "production"
        track: "canary"
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        sidecar.istio.io/inject: "false"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
        vault.hashicorp.com/agent-inject: "false"
        vault.hashicorp.com/role: "my-app-db-role"
        fluentbit.io/parser: "json"
        argocd.argoproj.io/hook: "PreSync"
        argocd.argoproj.io/hook-delete-policy: "HookSucceeded"
{{end}}
    spec:
      {{if $RuntimeClassName}}
      runtimeClassName: {{$RuntimeClassName}}
      {{end}}
{{if $RealisticPod }}
      initContainers:
      {{range $i := Loop 2}}
      - name: init-{{$i}}
        image: {{$.ImageRegistry}}/e2e-test-images/agnhost:2.53
        command: ["/bin/sh", "-c", "sleep 1"]
        {{if $RealisticPod20KB}}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: init-0
              resource: limits.cpu
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: init-0
              resource: limits.memory
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        - name: REDIS_URL
          value: "redis://main:6379/0"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_ENV
          value: "prod"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=payment-service,service.namespace=ecommerce-platform,service.version=v2.1.4,deployment.environment=production,cloud.provider=gcp,cloud.platform=gcp_kubernetes_engine,k8s.cluster.name=prod-us-east1-main"
        - name: SPRING_APPLICATION_JSON
          value: '{"server":{"port":8080,"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"datasource":{"hikari":{"maximum-pool-size":32,"minimum-idle":8,"connection-timeout":5000,"idle-timeout":300000,"max-lifetime":1800000}}}}'
        volumeMounts:
          {{if $EnablePVs}}
          - name: pv
            mountPath: /var/pv
          {{end}}
          - mountPath: /var/cache
            name: cache
          - mountPath: /var/logs
            name: logs
          - mountPath: /var/tmp
            name: tmp
          - mountPath: /var/data
            name: data
          - mountPath: /var/work
            name: work
          - mountPath: /var/state
            name: state
          - mountPath: /var/scratch
            name: scratch
          - mountPath: /var/spool
            name: spool
          - mountPath: /var/backups
            name: backups
          {{if not $EnablePVs}}
          - mountPath: /var/opt
            name: opt
          {{end}}
        {{end}}
      {{end}}
      containers:
      - name: main
        image: {{.ImageRegistry}}/pause:3.9
        ports:
          - containerPort: 80
            name: web
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: main
              resource: limits.cpu
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: main
              resource: limits.memory
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        - name: REDIS_URL
          value: "redis://main:6379/0"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_ENV
          value: "prod"
        {{if $RealisticPod20KB}}
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=payment-service,service.namespace=ecommerce-platform,service.version=v2.1.4,deployment.environment=production,cloud.provider=gcp,cloud.platform=gcp_kubernetes_engine,k8s.cluster.name=prod-us-east1-main"
        - name: SPRING_APPLICATION_JSON
          value: '{"server":{"port":8080,"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"datasource":{"hikari":{"maximum-pool-size":32,"minimum-idle":8,"connection-timeout":5000,"idle-timeout":300000,"max-lifetime":1800000}}}}'
        {{end}}
        resources:
          requests:
            cpu: 5m
            memory: 20M
        {{if or $EnablePVs $RealisticPod20KB}}
        volumeMounts:
          {{if $EnablePVs}}
          - name: pv
            mountPath: /var/pv
          {{end}}
          {{if $RealisticPod20KB}}
          - mountPath: /var/cache
            name: cache
          - mountPath: /var/logs
            name: logs
          - mountPath: /var/tmp
            name: tmp
          - mountPath: /var/data
            name: data
          - mountPath: /var/work
            name: work
          - mountPath: /var/state
            name: state
          - mountPath: /var/scratch
            name: scratch
          - mountPath: /var/spool
            name: spool
          - mountPath: /var/backups
            name: backups
          {{if not $EnablePVs}}
          - mountPath: /var/opt
            name: opt
          {{end}}
          {{end}}
        {{end}}
      - name: sidecar
        image: {{.ImageRegistry}}/pause:3.9
        {{if $RealisticPod20KB}}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: GOMAXPROCS
          valueFrom:
            resourceFieldRef:
              containerName: sidecar
              resource: limits.cpu
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              containerName: sidecar
              resource: limits.memory
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=75.0"
        - name: REDIS_URL
          value: "redis://main:6379/0"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: NODE_ENV
          value: "prod"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.name=payment-service,service.namespace=ecommerce-platform,service.version=v2.1.4,deployment.environment=production,cloud.provider=gcp,cloud.platform=gcp_kubernetes_engine,k8s.cluster.name=prod-us-east1-main"
        - name: SPRING_APPLICATION_JSON
          value: '{"server":{"port":8080,"shutdown":"graceful"},"spring":{"lifecycle":{"timeout-per-shutdown-phase":"30s"},"datasource":{"hikari":{"maximum-pool-size":32,"minimum-idle":8,"connection-timeout":5000,"idle-timeout":300000,"max-lifetime":1800000}}}}'
        {{end}}
        resources:
          requests:
            cpu: 5m
            memory: 20M
        {{if $RealisticPod20KB}}
        volumeMounts:
          {{if $EnablePVs}}
          - name: pv
            mountPath: /var/pv
          {{end}}
          - mountPath: /var/cache
            name: cache
          - mountPath: /var/logs
            name: logs
          - mountPath: /var/tmp
            name: tmp
          - mountPath: /var/data
            name: data
          - mountPath: /var/work
            name: work
          - mountPath: /var/state
            name: state
          - mountPath: /var/scratch
            name: scratch
          - mountPath: /var/spool
            name: spool
          - mountPath: /var/backups
            name: backups
          {{if not $EnablePVs}}
          - mountPath: /var/opt
            name: opt
          {{end}}
        {{end}}
      {{if $RealisticPod20KB}}
      volumes:
      - name: cache
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}
      - name: data
        emptyDir: {}
      - name: work
        emptyDir: {}
      - name: state
        emptyDir: {}
      - name: scratch
        emptyDir: {}
      - name: spool
        emptyDir: {}
      - name: backups
        emptyDir: {}
      {{if not $EnablePVs}}
      - name: opt
        emptyDir: {}
      {{end}}
      {{end}}
{{else}}
      containers:
      - name: {{.Name}}
        image: {{$Image}}
        env:
        - name: ENV_VAR
          value: {{RandDataWithSeed $podPayloadSize .Name}}
        ports:
          - containerPort: 80
            name: web
        resources:
          # Keep the CpuRequest/MemoryRequest request equal percentage of 1-core, 4GB node.
          # For now we're setting it to 0.5%.
          requests:
            cpu: 5m
            memory: "20M"
        {{if $EnablePVs}}
        volumeMounts:
          - name: pv
            mountPath: /var/pv
        {{end}}
{{end}}
      terminationGracePeriodSeconds: 1
      # Add not-ready/unreachable tolerations for 15 minutes so that node
      # failure doesn't trigger pod deletion.
      tolerations:
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 900
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 900
      {{if $TOLERATION}}
      - key: {{$TOLERATION}}
        operator: Exists
        effect: NoSchedule
      {{end}}
  {{if $EnablePVs}}
  # NOTE: PVs created this way should be cleaned-up manually, as deleting the StatefulSet doesn't automatically delete PVs.
  # To avoid deleting all the PVs at once during namespace deletion, they should be deleted explicitly via Phase.
  volumeClaimTemplates:
    - metadata:
        name: pv
      spec:
        accessModes: [ "ReadWriteOnce" ]
        {{if $PVStorageClass}}
        storageClassName: {{$PVStorageClass}}
        {{end}}
        resources:
          requests:
            storage: {{$PVSize}}
  {{end}}
